services:
  - type: worker
    name: gmrp-central-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        value: "1563889602559873136"
      - key: GUILD_ID
        sync: false
      - key: STAFF_ROLE_ID
        sync: false
